[package]
name = "search-svc"
version = "0.1.0"
edition = "2021"
description = "Rust arama mikroservisi — Tantivy tabanlı Türkçe indeksleme ve sorgulama (sıcak yol)"

[dependencies]
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
