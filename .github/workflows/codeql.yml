name: codeql

# CodeQL — GitHub'ın kendi SAST'ı.
#
# NEDEN SEMGREP/gosec VARKEN AYRICA: üçü farklı kural kümeleri ve farklı
# veri akışı motorları kullanıyor. CodeQL'in Go/SQL veri akışı analizi
# (taint tracking) Semgrep'in ücretsiz kurallarından derin; ayrıca
# sonuçlar GitHub Security sekmesinde açık kuyruk olarak birikir, yani
# "bulgu kapandı mı" takibi yapılabilir. Semgrep hâlâ kapı (CI'da kırar);
# CodeQL bulguları **kaydeder** (security-events), kapı değildir —
# CodeQL'in kural seti zamanla değişir, kapı yapsaydık habersiz kırılırdı.
#
# ÜCRETSİZ: public repo'larda sınırsız.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Haftalık: yeni kurallar eklenir, depo değişmese de taranmalı.
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analiz:
    name: CodeQL (${{ matrix.dil }})
    runs-on: ubuntu-latest
    # Sonuçları Security sekmesine yazmak için gerekli.
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dil: go
            dizin: go
          - dil: javascript-typescript
            dizin: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: ${{ matrix.dil }}
          # `security-and-quality` = güvenlik + kod kalitesi sorguları.
          # Yalnız `security` olsaydı bakım hatalarını kaçırırdık.
          queries: security-and-quality

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.dil == 'go'
        with:
          go-version: "1.27.3"
          cache-dependency-path: go/go.sum

      - name: Go derle (CodeQL veri akışı için gerekli)
        if: matrix.dil == 'go'
        working-directory: go
        run: go build ./...

      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          category: "/language:${{ matrix.dil }}"
