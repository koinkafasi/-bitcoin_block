name: scorecard

# OpenSSF Scorecard — depo tedarik zinciri SAĞLIĞINI puanlar.
#
# NEDEN: diğer kapılar "kodda açık var mı" sorar; Scorecard "bu depoyu
# güvenli geliştiriyor musun" sorar: dal koruması, inceleme zorunluluğu,
# imzalı commit, bağımlılık güncelleme aracı, tehlikeli workflow desenleri,
# bakımcı sayısı... 0-10 arası puan verir ve GitHub Security sekmesine
# yazar. Kapı DEĞİL (puan düşüşü CI'yı kırmaz) — haftalık trend göstergesi.

on:
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 2'   # Salı
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analiz:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF yüklemesi
      id-token: write          # publish_results (Scorecard API)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: sonuclar.sarif
          results_format: sarif
          # Sonuçları Scorecard API'sine yayınla (rozet + trend).
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: sonuclar.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: sonuclar.sarif
