# SonarQube tarama yapılandırması — bitcosar
#
# Kapsam BİLİNÇLİ: üretim kodu taranır. Derleme çıktısı, bağımlılık ağacı
# ve üretilen dosyalar HARİÇ — yoksa sonuç gürültüyle dolar (Rust `target/`
# yüz binlerce dosya, `*_templ.go` templ'in ürettiği kod).
sonar.projectKey=bitcosar
sonar.projectName=bitcosar
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=go,rust,collab-server,editor-src,deploy

# Hariç tutmalar:
#   go/internal/webui/templkit/*_templ.go  -> templ tarafından ÜRETİLİR
#   rust/**/target                          -> derleme çıktısı
#   node_modules / dist / vendor            -> bağımlılık
#   .runtime / .git                         -> veri ve geçmiş
#   go/bin                                  -> ikili dosyalar
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/vendor/**,\
  rust/**/target/**,\
  go/bin/**,\
  go/internal/webui/templkit/*_templ.go,\
  .runtime/**,\
  .git/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/package-lock.json,\
  **/Cargo.lock,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ico,**/*.woff2,**/*.woff,**/*.ttf,**/*.pdf

# ---- HTML ANALİZİ KAPALI (bilinçli) ----
#
# ÖLÇÜM (10 Kasım 2026): depoda 42 `.html` var, 40'ı **Go html/template**
# (`{{define "..."}}`), yalnız 2'si gerçek HTML (biri test fixture, biri
# `.runtime/` çıktısı). Sonar Web eklentisi bu dosyaları HTML sanıp:
#
#   • 73 × "Add a <title> tag"      -> <title> `public_head` PARTIAL'ında
#   • 41 × "Input without label"    -> nitelikler templ ifadesiyle geliyor
#   • 38 × "Duplicate id"           -> her `{{define}}` AYRI sayfa; `id="main"`
#                                      her birinde bir kez, çakışma yok
#
# Yani 152 bulgunun 152'si YANLIŞ POZİTİF. Go template'leri HTML olarak
# ayrıştırmak yapısal olarak mümkün değil; susturmanın doğru yolu türü
# yanlış tanımamak.
#
# Gerçek HTML `public_head` şablonu VE templ dosyaları üzerinden Go
# tarafında üretiliyor; erişilebilirlik orada `cd_*` testleriyle korunuyor.
sonar.html.file.suffixes=.xhtml

# Test dosyaları analiz edilir ama "test kodu" olarak işaretlenir:
# kapsam/ölü kod kuralları üretim kodu için anlamlı.
sonar.tests=go,rust,collab-server,editor-src
sonar.test.inclusions=**/*_test.go,**/*_test.rs,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts

# ---- KAPSAM (coverage) ----
#
# Go: `bash deploy/scripts/kapsam-uret.sh` → `coverage.out` (depo kökü).
# Yollar `go/...` önekiyle yazılır (Sonar depo köküne göre çözer).
#
# ÖLÇÜM (10 Kasım 2026): Go birim testleri **%22,5** kapsıyor. Düşük
# görünmesinin nedeni DB/HTTP gerektiren paketlerin (`httpapi`, `repo`)
# birim testlerinde koşmaması — entegrasyon testleri ayrı hat.
#
# neden coverage.exclusions: JS/TS/CSS için test koşucusu (vitest/jest)
# KURULU DEĞİL; bu dosyalar hiçbir zaman kapsam üretmez. Onları kapsam
# PAYDASINA katmak, kalite kapısını yapısal olarak geçilemez yapar
# (ölçüldü: aksi hâlde new_coverage %5,2'de çakılıyordu). Kapsam yalnız
# ÖLÇÜLEBİLEN dilde — Go — hesaplanır; JS/TS hâlâ ANALİZ edilir (hata/koku).
sonar.coverage.exclusions=\
  **/*.js,**/*.mjs,**/*.cjs,**/*.jsx,**/*.ts,**/*.tsx,**/*.css,**/*.scss
sonar.go.coverage.reportPaths=coverage.out
